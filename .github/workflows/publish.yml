name: Publish image

on:
  push:
    branches: [music-library-index, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Lowercase the owner for GHCR (repo is johnpc — already lowercase).
          tags: |
            ghcr.io/johnpc/marlin-search:latest
            ghcr.io/johnpc/marlin-search:${{ github.sha }}
          # Multi-arch so it runs on the umbrel host (arm64) and x86.
          platforms: linux/amd64,linux/arm64
